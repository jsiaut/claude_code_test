# config.yaml — seul fichier de configuration du modèle (spec v6.14, §0).
# Données de départ : annexe B. Les critères des annexes E et F et les seuils sont
# commités avant toute requête à la SEC, et leur empreinte est envoyée à l'utilisateur
# hors du dépôt (§11.1). Tout changement ultérieur est signalé en tête de synthesis.md.
# Prose en français, identifiants en anglais sans accent (§0).

spec_version: "6.14"

user_agent:
  # Fourni par l'utilisateur le 2026-10-07, jamais inventé (§0, §9.5). Le dépôt GitHub
  # est public : l'adresse de contact est masquée ici, comme dans toute copie partagée
  # (§9.5). La valeur exacte se lit dans SEC_USER_AGENT, sinon dans
  # secrets/user_agent.txt (non versionné). Décision D-0001 de decisions.md.
  name: SEC_rapport_test
  contact: "<adresse masquée>"
  value_sources: ["env:SEC_USER_AGENT", "file:secrets/user_agent.txt"]
  sec_hosts: [www.sec.gov, data.sec.gov, efts.sec.gov, xbrl.sec.gov]

scope: [lender, text]        # blocs de §14 ouverts sur décision de l'utilisateur (§11.1)
scope_decision:              # réponse de l'utilisateur à la seconde page (§11.1, §11.3)
  date: 2026-10-07
  decision: "prêteurs et texte"
  blocks: [lender, text]
  page: user_brief_2.md      # commit 9210738
  yield_presented:           # rendement présenté avec la question (delta.md du même commit)
    rank1_cells: {total: 15766, computed: 6322, bounded: 161, partial: 794, not_determinable: 8489}
    rank1_not_processed: 3394
    annex_e_e7: {outcomes: 12, indeterminate: 11, result: non_discrimination}
    fragility_events: 33
    pairs: {total: 36, documented_dependency: 4, commercial_with_financing: 4, financed_documented: 6}
    requests: 3741
    blocks_read: 1133
    exhibit_bodies_header_only: 217

window:
  start_fiscal_year: 2021    # premier exercice clos en 2021 ; fin : as_of (§11.1)
  include_interim: true
  companyfacts: unbounded    # seul companyfacts se tire sans borne (§3.2)
  extended_back_quarters: 4  # fenêtre allongée : fenêtre reculée de quatre trimestres (E.0)
  preceding_quarters: 8      # instances et texte : fenêtre allongée + huit trimestres (§3.2, §11.1)

