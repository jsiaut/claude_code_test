      - "même rapport : « The Reorganization Transactions were accounted for as a reverse recapitalization with the Company consolidating GDH LP, which was the accounting acquirer and the predecessor entity »"
      - "10-Q 0001859392-25-000005 (T1 2025) : « the Corporation did not have any subsidiaries and as such the numbers presented as of the three months ended March 31, 2025 and the year ended December 31, 2024 are on a stand-alone basis » : hors du groupe (D-0053)"

