  # est public : l'adresse de contact est masquée ici, comme dans toute copie partagée
  # (§9.5). La valeur exacte se lit dans SEC_USER_AGENT, sinon dans
  # secrets/user_agent.txt (non versionné). Décision D-0001 de decisions.md.
