# Bloc montages (D-0046, D-0049) : un montage = une recherche plein texte d'EDGAR fixée d'avance, les
# rapports périodiques de déposants nommés, des termes qualifiants et un plafond d'unités. Un terme ne
# qualifie jamais une pièce d'un déposant dont il est le nom (owner) ; only_in le réserve aux pièces de
# déposants nommés. Les fenêtres : deux paragraphes avant et deux après, fondues (D-0046, point 4).
montages:
  meta_hyperion:
    decision: D-0046
    period: ["2025-10-01", "2026-10-07"]
    queries:
      - {q: '"Beignet Investor"'}
      - {q: '"Blue Owl" Hyperion'}
      - {q: '"Blue Owl" "Richland Parish"'}
      - {q: '"Blue Owl" "Meta Platforms"'}
      - {q: '"Blue Owl"', cik: "0001326801"}
    periodic: ["0001823945"]          # Blue Owl Capital Inc.
    terms:
      - {rx: '\bBeignet\b'}
      - {rx: 'Richland Parish'}
      - {rx: '\bMeta\b', owner: ["meta platforms"]}
      - {rx: '\bBlue Owl\b', owner: ["blue owl"]}
    noted_terms: ['\bBeignet\b', 'Richland Parish', '\bMeta\b', '\bHyperion\b', '\bBlue Owl\b']
    cap: 40
  athene_whco:
    decision: D-0049
    period: ["2026-01-01", "2026-10-07"]
    queries:
      - {q: '"WarehouseCo Intermediate Holdings"'}
      - {q: '"WarehouseCo"'}
      - {q: '"capital solution" "Broadcom"'}
      - {q: '"Apollo"', cik: "0001730168"}
      - {q: '"Athene"', cik: "0001730168"}
      - {q: '"Broadcom"', cik: "0001527469"}
      - {q: '"Broadcom"', cik: "0001858681"}
    periodic: ["0001527469", "0001858681"]   # Athene Holding Ltd., Apollo Global Management, Inc.
    terms:
      - {rx: '\bWarehouseCo\b'}
      - {rx: '\bWHCO\b'}
      - {rx: '[Cc]apital [Ss]olution', owner: ["apollo global management", "athene"]}   # métier d'Apollo (Apollo Capital Solutions) : amendement du point 7
      - {rx: '\bBroadcom\b', owner: ["broadcom"]}
      - {rx: '\bAnthropic\b'}
      - {rx: '\bApollo\b', owner: ["apollo global management", "athene"]}
      - {rx: '\bAthene\b', owner: ["apollo global management", "athene"]}
    noted_terms: ['\bWarehouseCo\b', '\bWHCO\b', '[Cc]apital [Ss]olution', '\bBroadcom\b', '\bAnthropic\b', '\bApollo\b', '\bAthene\b']
    cap: 40
  galaxy_helios:
    decision: D-0049
    period: ["2025-01-01", "2026-10-07"]
    queries:
      - {q: '"Helios" "CoreWeave"'}
      - {q: '"Galaxy Digital"', cik: "0001769628"}
      - {q: '"CoreWeave"', cik: "0001859392"}
    periodic: ["0001859392"]          # Galaxy Digital Inc.
    terms:
      - {rx: '\bHelios\b', only_in: ["galaxy digital", "coreweave"]}
      - {rx: '\bCoreWeave\b', owner: ["coreweave"]}
      - {rx: '\bGalaxy\b', owner: ["galaxy digital"]}
    noted_terms: ['\bHelios\b', '\bCoreWeave\b', '\bGalaxy\b']
    cap: 71                           # amendement de D-0049, point 11 (plafond initial : 40)
    focus: "galaxy digital"           # ordre : autres déposants, 8-K, rapports périodiques ; plus récent d'abord
    dedupe: true                      # un texte distinct se lit une fois
    exclude:                          # comptés, non lus (D-0049, point 11)
      - {filer: "galaxy digital", forms: ["S-1", "S-1/A", "S-4/A", "DRS", "DRS/A", "424B3", "424B4"],
         reason: "prospectus ou déclaration d'enregistrement qui reprend les rapports périodiques ou décrit une offre"}
      - {filer: "galaxy digital", forms: ["8-K"], file_types: ["EX-99.2"], reason: "présentation trimestrielle des résultats"}
      - {filer: "galaxy digital", forms: ["8-K"], file_rx: "xpressrelease", reason: "communiqué trimestriel des résultats"}

