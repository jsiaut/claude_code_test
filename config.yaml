# commités avant toute requête à la SEC, et leur empreinte est envoyée à l'utilisateur
# hors du dépôt (§11.1). Tout changement ultérieur est signalé en tête de synthesis.md.
# Prose en français, identifiants en anglais sans accent (§0).

