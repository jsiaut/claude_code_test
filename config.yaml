# Bloc lender_portfolio (D-0045) : portefeuille entier de chaque BDC des archives en cache, cinq mesures.
lender_portfolio:
  universe: all_bdc            # toutes les BDC des BDC Data Sets en cache ; un véhicule = un déclarant (CIK)
  view: as_known               # premier dépôt d'un véhicule pour une date de bilan
  software_coverage_min: 0.9   # part de la juste valeur qui doit porter un secteur pour calculer la part logiciel
  consecutive_gap_days_max: 120   # deux dates de bilan successives d'un véhicule, au plus
  platforms:                   # regroupement de présentation par la marque du gestionnaire ; aucun groupe économique affirmé
    Blue Owl: {name_terms: ["Blue Owl", "Owl Rock"]}
    Apollo: {name_terms: ["Apollo"]}            # D-0055, point 7 : choix de l'exécutant, soumis à l'utilisateur
    Blackstone: {name_terms: ["Blackstone"]}
  peers:                       # repères nommés d'avance, pour la lecture
    - {name: "Ares Capital Corp", cik: "0001287750"}
    - {name: "Blackstone Secured Lending Fund", cik: "0001736035"}
    - {name: "Blackstone Private Credit Fund", cik: "0001803498"}
    - {name: "Golub Capital BDC, Inc.", cik: "0001476765"}
    - {name: "FS KKR Capital Corp", cik: "0001422183"}
    - {name: "HPS Corporate Lending Fund", cik: "0001838126"}
# Bloc lender_liabilities (D-0047) : passif des BDC de l'univers de D-0045 (couverture, levier, offres de rachat).
lender_liabilities:
  universe: all_bdc              # univers, plateforme et repères de lender_portfolio (D-0045, point 3)
  view: as_known
  consecutive_gap_days_max: 120  # F14 : trois dates de bilan successives, 120 jours au plus entre deux
  coverage_concept: InvestmentCompanySeniorSecurityIndebtednessAssetCoverageRatio   # concept standard seulement
  coverage_scale:                # règle d'échelle (D-0047, point 4) ; hors de ces bandes : non déterminable
    ratio: [1, 100]              # ratio écrit tel quel
    percent: [100, 1000]         # pourcentage écrit en nombre : ÷ 100
    per_thousand: [1000, 10000]  # montant par tranche de 1 000 $ de dette : ÷ 1 000
  net_assets_concepts: [AssetsNet, StockholdersEquity]   # dans cet ordre
  tenders:
    window: ["2022-10-01", "2026-10-07"]   # dépôt du SC TO-I
    initial_form: "SC TO-I"
    amendment_form: "SC TO-I/A"
    program_min_offers: 4        # F16 : au moins quatre offres successives
    program_gap_days_max: 120    # chacune déposée 120 jours au plus après la précédente
    interruption_days: 120       # puis aucune offre dans les 120 jours
    listing_forms: ["8-A12B"]
    exit_forms: ["N-54C", "15-12B", "15-12G", "15-15D"]
  announcements:
    eight_k_items: ["1.01", "1.02", "2.01", "3.03", "7.01", "8.01"]
    terms: ["tender offer", "repurchase", "redemption", "merger", "suspend"]
    window_paragraphs: 2
    after_event_days: 30
    cap: 40
# Annexe F — événements de fragilité, liste fermée, commitée avec l'annexe E (§11.1).
annex_f:
  source: "spec v6.14, annexe F"
  closed_list: true
  measure_id: fragility_event
  breakdown_field: event_id
  weighting: none
  totals: none                 # ni entre observables, ni entre groupes, ni dans le temps
  score: none
  expected_universe: "une cellule par groupe, observable et trimestre ; une source non lue ne passe jamais pour un trimestre sans événement"
  carries: [period, knowledge_date]
  events:
    F1:
      observable: "capex décaissé supérieur au CFO deux trimestres de suite"
      source: "termes de capex_to_cfo, term = without (§6.2)"
      rule: {measure: capex_to_cfo, term: without, condition: "capex_cash > cfo", consecutive_quarters: 2, dated_at: "fin du second trimestre"}
    F2:
      observable: "fcf_after_counterparty_financing négatif"
      source: "§4.4"
      rule: {measure: fcf_after_counterparty_financing, condition: "value < 0"}
    F3:
      observable: "un backstop ou une garantie dont trigger_occurred = yes"
      source: "§5.3"
      rule: {categories: [guarantee, capacity_backstop, residual_value_guarantee, credit_enhancement, backstop], condition: "trigger_occurred = yes (un dépôt constate l'événement)"}
    F4:
      observable: "un amendement ou une dérogation de clause financière"
      source: "sig_covenant_events (§4.5)"
      rule: {measure: sig_covenant_events}
    F5:
      observable: "une faiblesse significative du contrôle interne"
      source: "sig_material_weakness (§4.5)"
      rule: {measure: sig_material_weakness}
    F6:
      observable: "une dépréciation d'investissement"
      source: "investment_impairment (§6.2)"
      rule: {measure: earnings_bridge_pretax, term: investment_impairment, condition: "value != 0"}
    F7:
      observable: "une baisse d'une durée d'amortissement publiée"
      source: "depreciation_life_published (§6.2)"
      rule: {measure: depreciation_life_published, condition: "une borne publiée de la durée d'une classe de même libellé est inférieure à celle de la publication précédente"}
    F8:
      observable: "un revenue_growth en glissement annuel qui passe sous zéro"
      source: "revenue_growth, term = yoy (§4.2)"
      rule: {measure: revenue_growth, term: yoy, condition: "value < 0 alors que la valeur de la période précédente est >= 0"}
    F9:
      observable: "un item 1.02 de 8-K sur un contrat de capacité"
      source: "section 1.02 lue en phase 2 (§11.1)"
      rule: {eight_k_item: "1.02", contract: capacity}
    F10:
      observable: "un doute sur la continuité d'exploitation"
      source: "sig_going_concern (§4.5)"
      rule: {measure: sig_going_concern}
    F11:
      observable: "juste valeur ÷ coût du portefeuille de prêts d'une BDC en baisse deux trimestres de suite"
      source: "bdc_portfolio_fv_to_cost (bloc lender_portfolio, D-0045)"
      subjects: bdc_vehicles     # véhicules de l'univers du bloc, pas les groupes
      added_by: D-0045
      rule: {measure: bdc_portfolio_fv_to_cost, condition: "valeur(t) < valeur(t-1) < valeur(t-2)", consecutive_quarters: 2, dated_at: "fin du second trimestre"}
    F12:
      observable: "part des intérêts capitalisés du portefeuille d'une BDC (borne basse) en hausse deux trimestres de suite"
      source: "bdc_portfolio_pik_share (bloc lender_portfolio, D-0045)"
      subjects: bdc_vehicles
      added_by: D-0045
      rule: {measure: bdc_portfolio_pik_share, condition: "borne(t) > borne(t-1) > borne(t-2)", consecutive_quarters: 2, dated_at: "fin du second trimestre"}
    F13:
      observable: "part des prêts sans accumulation d'intérêts d'une BDC (borne basse) en hausse deux trimestres de suite"
      source: "bdc_portfolio_non_accrual_share (bloc lender_portfolio, D-0045)"
      subjects: bdc_vehicles
      added_by: D-0045
      rule: {measure: bdc_portfolio_non_accrual_share, condition: "borne(t) > borne(t-1) > borne(t-2)", consecutive_quarters: 2, dated_at: "fin du second trimestre"}
    F14:
      observable: "ratio de couverture des titres de créance d'une BDC en baisse deux trimestres de suite"
      source: "bdc_liab_asset_coverage (bloc lender_liabilities, D-0047)"
      subjects: bdc_vehicles
      added_by: D-0047
      rule: {measure: bdc_liab_asset_coverage, condition: "valeur(t) < valeur(t-1) < valeur(t-2)", consecutive_quarters: 2, dated_at: "fin du second trimestre"}
    F15:
      observable: "offre de rachat d'une BDC dont les parts acceptées sont inférieures aux parts apportées (réduction au prorata)"
      source: "amendement final du SC TO-I (bloc lender_liabilities, D-0047)"
      subjects: bdc_vehicles
      added_by: D-0047
      rule: {measure: bdc_tender_acceptance_ratio, condition: "acceptées < apportées, ou réduction au prorata annoncée", dated_at: "expiration de l'offre"}
    F16:
      observable: "interruption d'un programme régulier d'offres de rachat d'une BDC"
      source: "inventaire EDGAR des SC TO-I (bloc lender_liabilities, D-0047)"
      subjects: bdc_vehicles
      added_by: D-0047
      rule: {condition: "au moins quatre offres déposées à 120 jours au plus d'intervalle, puis aucune offre dans les 120 jours ; ni 8-A12B ni N-54C ou formulaire 15 dans l'intervalle", dated_at: "dépôt de la dernière offre + 120 jours"}

concept_anchors:             # contrôle de la règle de §8.3 ; noms locaux présents dans us-gaap-2026.xsd (annexe D)
  revenue_total: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax]
  net_income: [NetIncomeLoss]
  operating_income: [OperatingIncomeLoss]
  pretax_income_continuing: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest]
  total_assets: [Assets]
  current_assets: [AssetsCurrent]
  total_liabilities: [Liabilities]
  current_liabilities: [LiabilitiesCurrent]
  temporary_equity: [TemporaryEquityCarryingAmountAttributableToParent]
  equity_including_nci: [StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
  cash_and_equivalents: [CashAndCashEquivalentsAtCarryingValue]
