    before: "rapports en IFRS (20-F, 6-K)"
    evidence: "10-K 2025, 0001878848-25-000063 : « Effective this fiscal year, we have transitioned from International Financial Reporting Standards [...] to GAAP »"

reverse_combinations:        # déclarant légal distinct de l'acquéreur comptable (ASC 805-40 ; fusion inversée,
                             # recapitalisation inversée d'une SPAC) : les rapports du CIK pour les périodes closes
                             # avant la réalisation présentent le déclarant légal, hors du groupe ; l'historique du
                             # groupe est celui de l'acquéreur comptable, publié par les rapports postérieurs.
                             # Rupture de périmètre (§10.2) : l'historique antérieur est tronqué à gauche (D-0043)
  WULF:
    consummation: "2021-12-13"
    legal_registrant: "IKONICS Corporation"
    accounting_acquirer: "TeraCub Inc. (constituée le 8 février 2021)"
    evidence:
      - "8-K12B 0000950142-21-003986 : « This Current Report on Form 8-K establishes TeraWulf as the successor issuer to IKONICS pursuant to Rule 12g-3(c) under the Securities Exchange Act of 1934 »"
      - "10-K 0001104659-22-041168 (exercice 2021) : « For financial accounting purposes, the business combination was treated as a reverse merger whereby the accounting acquirer was TeraCub »"
  CIFR:
    consummation: "2021-08-27"
    legal_registrant: "Good Works Acquisition Corp."
    accounting_acquirer: "Cipher Mining Technologies Inc. (constituée le 7 janvier 2021)"
    evidence:
      - "8-K 0001193125-21-260900 (date de l'événement : 2021-08-27, items 2.01 et 3.03)"
      - "10-Q 0000950170-21-004222 (T3 2021) : « The Merger was accounted for as a reverse recapitalization in accordance with U.S. GAAP » ; « Cipher was determined to be the accounting acquirer »"
    pre_combination_filings:   # dépôts postérieurs à la réalisation qui ne portent que sur les états du déclarant légal
      - {accession: "0001193125-21-366363", form: "8-K", items: "4.02", quote: "Therefore, the errors relate to the pre-business combination SPAC and its financial statements"}
  CORZ:
    consummation: "2022-01-19"
    legal_registrant: "Power & Digital Infrastructure Acquisition Corp."
    accounting_acquirer: "Core Scientific Holding Co."
    evidence:
      - "8-K 0001193125-22-016157 (date de l'événement : 2022-01-19, items 2.01 et 3.03)"
      - "10-Q 0001628280-22-014350 (T1 2022) : « The Merger is accounted for as a reverse recapitalization with the Company being the accounting acquirer »"
      - "10-K 0001193125-22-088850 (exercice 2021, déposé après la réalisation) : états de la SPAC (actif de 346 368 517 $ au 31 décembre 2021), hors du groupe"
  GLXY:
    consummation: "2025-05-13"
    legal_registrant: "Galaxy Digital Inc. (anciennement Galaxy Digital Pubco Inc.), sans filiale avant la réorganisation"
    accounting_acquirer: "Galaxy Digital Holdings LP"
    evidence:
