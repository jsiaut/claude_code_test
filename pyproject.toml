# Réglages de ruff (`make lint`). Les dépendances et leurs versions exactes sont dans requirements.txt, seule liste
# (D-0087) : `pip install -r requirements.txt`.
[tool.ruff]
target-version = "py313"
line-length = 125
extend-exclude = ["cache", "db", "work", "tables", "audit"]

[tool.ruff.lint]
select = ["F", "E9"]      # pyflakes et erreurs de syntaxe : noms indéfinis, imports et variables inutilisés
